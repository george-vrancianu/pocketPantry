<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pocket Pantry — Scan</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&amp;family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#FFFFFF}a:hover{color:#DDEBE2}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; background: #101813; font-family: 'DM Sans', sans-serif; color: #FFFFFF">

<div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 0; height: 690px; background: #1C2922; border-radius: 0 0 32px 32px"></div>

<div style="position: absolute; left: 16px; right: 16px; top: 22px; display: flex; align-items: center; justify-content: space-between">
<a href="Main.dc.html" aria-label="Close scanner" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 22px; background: rgba(255,255,255,0.12); color: #FFFFFF"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></a>
<p style="margin: 0; font-size: 15px; font-weight: 700">Scan {{modeLabel}}</p>
<button type="button" aria-label="Toggle flash" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 22px; border: 0; background: rgba(255,255,255,0.12); color: #FFFFFF; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 3 5 13.5h6L10 21l8-10.5h-6z"></path></svg></button>
</div>

<div aria-hidden="true" style="position: absolute; left: 55px; top: 110px; width: 280px; height: 300px">
<span style="position: absolute; left: 0; top: 0; width: 40px; height: 40px; box-sizing: border-box; border-top: 3px solid #FFFFFF; border-left: 3px solid #FFFFFF; border-top-left-radius: 20px"></span>
<span style="position: absolute; right: 0; top: 0; width: 40px; height: 40px; box-sizing: border-box; border-top: 3px solid #FFFFFF; border-right: 3px solid #FFFFFF; border-top-right-radius: 20px"></span>
<span style="position: absolute; left: 0; bottom: 0; width: 40px; height: 40px; box-sizing: border-box; border-bottom: 3px solid #FFFFFF; border-left: 3px solid #FFFFFF; border-bottom-left-radius: 20px"></span>
<span style="position: absolute; right: 0; bottom: 0; width: 40px; height: 40px; box-sizing: border-box; border-bottom: 3px solid #FFFFFF; border-right: 3px solid #FFFFFF; border-bottom-right-radius: 20px"></span>
<span style="position: absolute; left: 24px; right: 24px; top: 148px; height: 2px; background: #8DBBA0; border-radius: 1px"></span>
</div>

<div style="position: absolute; left: 24px; right: 24px; top: 432px; text-align: center">
<p style="margin: 0; font-size: 16px; font-weight: 700">{{hint}}</p>
<p style="margin: 6px 0 0; font-size: 13px; color: #B8C4BC">{{detail}}</p>
</div>

<div role="group" aria-label="Scan mode" style="position: absolute; left: 12px; right: 12px; top: 520px; display: flex; justify-content: center; gap: 6px">
<sc-for list="{{modes}}" as="m" hint-placeholder-count="4">
<sc-if value="{{m.active}}" hint-placeholder-val="{{false}}"><button type="button" aria-pressed="true" onClick="{{m.pick}}" style="height: 40px; padding: 0 14px; border-radius: 20px; border: 0; background: #FFFFFF; color: #17231C; font-family: inherit; font-size: 13px; font-weight: 700; cursor: pointer">{{m.label}}</button></sc-if>
<sc-if value="{{m.inactive}}" hint-placeholder-val="{{true}}"><button type="button" aria-pressed="false" onClick="{{m.pick}}" style="height: 40px; padding: 0 14px; border-radius: 20px; border: 0; background: rgba(255,255,255,0.10); color: #D5DED8; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer">{{m.label}}</button></sc-if>
</sc-for>
</div>

<div style="position: absolute; left: 0; right: 0; top: 584px; display: flex; align-items: center; justify-content: center; gap: 44px">
<button type="button" aria-label="Choose from photos" style="display: flex; align-items: center; justify-content: center; width: 48px; height: 48px; border-radius: 24px; border: 0; background: rgba(255,255,255,0.12); color: #FFFFFF; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="14" rx="2"></rect><circle cx="9" cy="10" r="1.5"></circle><path d="m20 16-4.5-4.5L7 19"></path></svg></button>
<button type="button" aria-label="Take photo" style="width: 76px; height: 76px; box-sizing: border-box; border-radius: 38px; border: 4px solid #FFFFFF; background: transparent; padding: 5px; cursor: pointer"><span style="display: block; width: 100%; height: 100%; border-radius: 50%; background: #FFFFFF"></span></button>
<button type="button" aria-label="Add manually" style="display: flex; align-items: center; justify-content: center; width: 48px; height: 48px; border-radius: 24px; border: 0; background: rgba(255,255,255,0.12); color: #FFFFFF; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"></path></svg></button>
</div>

<nav aria-label="Main" style="position: absolute; left: 16px; right: 16px; bottom: 16px; height: 76px; box-sizing: border-box; padding: 8px; background: #1C2922; border: 1px solid #2E3D34; border-radius: 26px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px">
<a href="Shopping.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #B8C4BC; font-size: 11px; font-weight: 600"><span style="display: flex; align-items: center; justify-content: center; width: 52px; height: 32px; border-radius: 16px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 8h14l-1.2 11.2a2 2 0 0 1-2 1.8H8.2a2 2 0 0 1-2-1.8z"></path><path d="M9 8V7a3 3 0 0 1 6 0v1"></path></svg></span><span>Shopping</span></a>
<a href="Pantry.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #B8C4BC; font-size: 11px; font-weight: 600"><span style="display: flex; align-items: center; justify-content: center; width: 52px; height: 32px; border-radius: 16px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3h8v3H8z"></path><path d="M7 6h10a1 1 0 0 1 1 1v12a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V7a1 1 0 0 1 1-1z"></path><path d="M6 11h12"></path></svg></span><span>Pantry</span></a>
<a href="Recipes.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #B8C4BC; font-size: 11px; font-weight: 600"><span style="display: flex; align-items: center; justify-content: center; width: 52px; height: 32px; border-radius: 16px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4.5A1.5 1.5 0 0 1 6.5 3H19v15H6.5A1.5 1.5 0 0 0 5 19.5z"></path><path d="M5 19.5A1.5 1.5 0 0 0 6.5 21H19v-3"></path><path d="M9 7.5h6"></path></svg></span><span>Recipes</span></a>
<a href="Scan.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #FFFFFF; font-size: 11px; font-weight: 700"><span style="display: flex; align-items: center; justify-content: center; width: 52px; height: 32px; border-radius: 16px; background: #FFFFFF; color: #17231C"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8.5A1.5 1.5 0 0 1 5.5 7H8l1.6-2h4.8L16 7h2.5A1.5 1.5 0 0 1 20 8.5v9a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 17.5z"></path><circle cx="12" cy="12.5" r="3.5"></circle></svg></span><span>Scan</span></a>
</nav>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { mode: "product" };
  }
  renderVals() {
    const list = [
      { id: "product", label: "Product", hint: "Point at a barcode or label", detail: "Adds it to your pantry with its best-before date." },
      { id: "receipt", label: "Receipt", hint: "Fit the whole receipt in the frame", detail: "Adds every item from your shop in one go." },
      { id: "plate", label: "Plate", hint: "Hold steady above your plate", detail: "Logs the meal and takes what you used out of the pantry." },
      { id: "ingredients", label: "Ingredients", hint: "Spread items out on the counter", detail: "Recognises loose produce and suggests recipes." }
    ];
    const cur = list.find((m) => m.id === this.state.mode) || list[0];
    return {
      hint: cur.hint,
      detail: cur.detail,
      modeLabel: cur.label.toLowerCase(),
      modes: list.map((m) => ({
        ...m,
        active: m.id === cur.id,
        inactive: m.id !== cur.id,
        pick: () => this.setState({ mode: m.id })
      }))
    };
  }
}
</script>
</body>
</html>
