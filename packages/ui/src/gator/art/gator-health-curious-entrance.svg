<svg xmlns="http://www.w3.org/2000/svg" viewBox="-8 -70 264 260" width="264" height="260" class="gator g-health-curious" data-v="enter" role="img" aria-label="Gator, curious"><style>svg{--amp:1;--t:1}
/* ---------- motion rig ---------- */
.gator g[class]:not([transform]),.gator .arc{transform-box:fill-box}
.rig{transform-origin:50% 100%}
.eye{transform-origin:50% 55%}
.hat{transform-origin:50% 100%}
.tail{transform-origin:95% 80%}
.sparkle,.dot,.bubble,.arc{transform-origin:50% 50%}
.jaw{transform-origin:13% 8%}
.head{transform-origin:45% 95%}
.qmark{transform-origin:40% 100%}
.basket{transform-origin:50% 12%}
.whisk{transform-origin:100% 100%}
.spoon{transform-origin:0% 100%}
.rack{transform-origin:50% 0%}
.tick path{stroke-dasharray:1; stroke-dashoffset:0}
/* Idle: breathe, blink, hat sway, tail */
.drop{transform-origin:50% 0%}
/* Signature defaults */
/* Entrance (looped so you can watch it) */
/* Tap (looped) */
/* Real tap on any stage */
/* ---- Signatures ---- */
/* ---- Keyframes (amplitudes scale with --amp) ---- */
[data-v="enter"] .rig{animation:popInOnce calc(1.2s*var(--t)) linear 1 forwards}
[data-v="enter"] .sparkle,[data-v="enter"] .dot,[data-v="enter"] .bubble,[data-v="enter"] .arc,[data-v="enter"] .qmark,[data-v="enter"] .drop{animation:lateInOnce calc(1.3s*var(--t)) linear 1 forwards}
@keyframes popInOnce{0%{opacity:0;transform:translateY(30px) scale(.4)}19%{opacity:1}38%{transform:translateY(calc(-14px*var(--amp))) scale(calc(1 - .06*var(--amp)),calc(1 + .1*var(--amp)))}62%{transform:translateY(0) scale(calc(1 + .1*var(--amp)),calc(1 - .1*var(--amp)))}81%{transform:scale(calc(1 - .03*var(--amp)),calc(1 + .03*var(--amp)))}100%{transform:none;opacity:1}}
@keyframes lateInOnce{0%,65%{opacity:0;transform:scale(.3)}87%{opacity:1;transform:scale(1.15)}100%{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){svg *{animation:none !important}}</style><defs>
