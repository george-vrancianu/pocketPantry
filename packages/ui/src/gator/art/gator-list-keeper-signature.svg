<svg xmlns="http://www.w3.org/2000/svg" viewBox="-8 -40 296 284" width="296" height="284" class="gator g-listkeeper" data-v="sig" role="img" aria-label="Gator in glasses reading the list"><style>.gator g[class]:not([transform]), .gator .arc{transform-box:fill-box}
.rig{transform-origin:50% 100%}
.eye{transform-origin:50% 55%}
.hat{transform-origin:50% 100%}
.tail{transform-origin:95% 80%}
.sparkle, .dot, .bubble, .arc{transform-origin:50% 50%}
.jaw{transform-origin:13% 8%}
.head{transform-origin:45% 95%}
.qmark{transform-origin:40% 100%}
.basket{transform-origin:50% 12%}
.whisk{transform-origin:100% 100%}
.spoon{transform-origin:0% 100%}
.rack{transform-origin:50% 0%}
.tick path{stroke-dasharray:1; stroke-dashoffset:0}
[data-v="sig"] .eye{animation:blink calc(4.4s) infinite}
[data-v="sig"] .eye-far{animation-delay:calc(.04s)}
.drop{transform-origin:50% 0%}
[data-v="sig"] .rig{animation:breathe calc(3.2s) ease-in-out infinite}
[data-v="sig"] .tail{animation:wag calc(1.6s) ease-in-out infinite}
.g-listkeeper[data-v="sig"] .tick path{animation:tickDraw calc(3s) ease-out infinite; animation-delay:calc(var(--i)*.5s)}
.g-listkeeper[data-v="sig"] .pencil{animation:scribble calc(.9s) linear infinite}
.g-listkeeper[data-v="sig"] .pupil{animation:scan calc(3s) ease-in-out infinite}
.g-listkeeper[data-v="sig"] .head{animation:readNod calc(3s) ease-in-out infinite}
.g-listkeeper[data-v="sig"] .rig{animation:none}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(calc(1 + .006*1),calc(1 + .022*1))}}
@keyframes blink{0%,90%,97%,100%{transform:scaleY(1)}93.5%{transform:scaleY(.08)}}
@keyframes wag{0%,100%{transform:rotate(calc(-5deg*1))}50%{transform:rotate(calc(7deg*1))}}
@keyframes tickDraw{0%,12%{stroke-dashoffset:1}32%,88%{stroke-dashoffset:0}100%{stroke-dashoffset:0;opacity:0}}
@keyframes scribble{0%,100%{transform:translate(0,0)}20%{transform:translate(calc(3px*1),calc(-2px*1))}40%{transform:translate(calc(-1px*1),calc(1px*1))}60%{transform:translate(calc(3px*1),calc(-1px*1))}80%{transform:translate(calc(-2px*1),calc(1.5px*1))}}
@keyframes scan{0%,100%{transform:translate(calc(-2px*1),0)}50%{transform:translate(calc(2.5px*1),calc(2px*1))}}
@keyframes readNod{0%,100%{transform:rotate(0)}50%{transform:rotate(calc(2.5deg*1))}}
