<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pocket Pantry — Shopping list</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&amp;family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2E6A4D}a:hover{color:#1F4D37}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; background: #EEF1EA; font-family: 'DM Sans', sans-serif; color: #17231C">

<header style="display: flex; align-items: center; gap: 12px; padding: 24px 20px 14px">
<a href="Main.dc.html" aria-label="Home" style="display: flex; align-items: center; justify-content: center; flex-shrink: 0; width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; border: 1px solid #DCE3D8; color: #17231C"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V19a1 1 0 0 1-1 1h-4.5v-5.5h-5V20H5a1 1 0 0 1-1-1z"></path></svg></a>
<h1 style="margin: 0; flex-grow: 1; font-family: 'Bricolage Grotesque', sans-serif; font-size: 28px; font-weight: 700; letter-spacing: -0.02em">Shopping</h1>
<button type="button" aria-label="Share list" style="display: flex; align-items: center; justify-content: center; flex-shrink: 0; width: 44px; height: 44px; border-radius: 22px; border: 1px solid #DCE3D8; background: #FFFFFF; color: #17231C; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M8 8l4-4 4 4"></path><path d="M5 13v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"></path></svg></button>
</header>

<div style="margin: 0 20px; padding: 14px 14px 14px 16px; background: #FFFFFF; border: 1px solid #DCE3D8; border-radius: 20px; display: flex; align-items: center; gap: 14px">
<div style="flex-grow: 1; min-width: 0">
<p style="margin: 0; font-size: 15px; font-weight: 700">{{toBuy}} to buy</p>
<p style="margin: 2px 0 8px; font-size: 12px; color: #55635A">{{inBasket}} of {{total}} in your basket</p>
<div style="height: 6px; border-radius: 3px; background: #EEF1EA; overflow: hidden"><div style="height: 6px; background: #2E6A4D; width: {{pct}}"></div></div>
</div>
<button type="button" style="flex-shrink: 0; height: 44px; padding: 0 14px; border-radius: 14px; border: 0; background: #17231C; color: #FFFFFF; font-family: inherit; font-size: 13px; font-weight: 700; cursor: pointer">Move to pantry</button>
</div>

<div style="padding: 12px 20px 0">
<label style="display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 6px 0 16px; background: #FFFFFF; border: 1px solid #DCE3D8; border-radius: 16px">
<span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap">Add an item</span>
<input type="text" placeholder="Add an item…" style="flex-grow: 1; min-width: 0; border: 0; outline: 0; background: transparent; font-family: inherit; font-size: 15px; color: #17231C">
<button type="button" aria-label="Add to list" style="display: flex; align-items: center; justify-content: center; flex-shrink: 0; width: 40px; height: 40px; border-radius: 12px; border: 0; background: #2E6A4D; color: #FFFFFF; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
</label>
</div>

<sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
<div style="padding: 0 20px">
<h2 style="margin: 14px 4px 8px; font-size: 12px; font-weight: 700; color: #55635A; text-transform: uppercase; letter-spacing: 0.06em">{{g.name}}</h2>
<ul style="list-style: none; margin: 0; padding: 0 6px; background: #FFFFFF; border: 1px solid #DCE3D8; border-radius: 20px; overflow: hidden">
<sc-for list="{{g.items}}" as="it" hint-placeholder-count="3">
<li style="margin-top: -1px; border-top: 1px solid #EEF1EA">
<button type="button" onClick="{{it.toggle}}" aria-pressed="{{it.checked}}" style="width: 100%; display: flex; align-items: center; gap: 12px; min-height: 50px; padding: 0 10px; border: 0; background: transparent; text-align: left; cursor: pointer; color: #17231C; font-family: inherit">
<sc-if value="{{it.checked}}" hint-placeholder-val="{{false}}"><span style="flex-shrink: 0; width: 24px; height: 24px; border-radius: 8px; background: #2E6A4D; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"></path></svg></span></sc-if>
<sc-if value="{{it.open}}" hint-placeholder-val="{{true}}"><span style="flex-shrink: 0; width: 24px; height: 24px; box-sizing: border-box; border-radius: 8px; border: 2px solid #A7B3AA"></span></sc-if>
<span style="flex-grow: 1; min-width: 0">
<sc-if value="{{it.open}}" hint-placeholder-val="{{true}}"><span style="display: block; font-size: 15px; font-weight: 600">{{it.name}}</span></sc-if>
<sc-if value="{{it.checked}}" hint-placeholder-val="{{false}}"><span style="display: block; font-size: 15px; font-weight: 500; color: #66736B; text-decoration: line-through">{{it.name}}</span></sc-if>
<span style="display: block; font-size: 12px; color: #55635A">{{it.qty}}</span>
</span>
<sc-if value="{{it.hasTag}}" hint-placeholder-val="{{false}}"><span style="flex-shrink: 0; font-size: 11px; font-weight: 700; color: #2E6A4D; background: #DDEBE2; padding: 4px 8px; border-radius: 999px">{{it.tag}}</span></sc-if>
</button>
</li>
</sc-for>
</ul>
</div>
</sc-for>

<nav aria-label="Main" style="position: absolute; left: 16px; right: 16px; bottom: 16px; height: 76px; box-sizing: border-box; padding: 8px; background: rgba(255,255,255,0.94); border: 1px solid #DCE3D8; border-radius: 26px; box-shadow: 0 10px 30px rgba(23,35,28,0.12); display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px">
<a href="Shopping.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #2E6A4D; font-size: 11px; font-weight: 700"><span style="display: flex; align-items: center; justify-content: center; width: 52px; height: 32px; border-radius: 16px; background: #DDEBE2"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 8h14l-1.2 11.2a2 2 0 0 1-2 1.8H8.2a2 2 0 0 1-2-1.8z"></path><path d="M9 8V7a3 3 0 0 1 6 0v1"></path></svg></span><span>Shopping</span></a>
<a href="Pantry.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #55635A; font-size: 11px; font-weight: 600"><span style="display: flex; align-items: center; justify-content: center; width: 52px; height: 32px; border-radius: 16px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3h8v3H8z"></path><path d="M7 6h10a1 1 0 0 1 1 1v12a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V7a1 1 0 0 1 1-1z"></path><path d="M6 11h12"></path></svg></span><span>Pantry</span></a>
<a href="Recipes.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #55635A; font-size: 11px; font-weight: 600"><span style="display: flex; align-items: center; justify-content: center; width: 52px; height: 32px; border-radius: 16px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4.5A1.5 1.5 0 0 1 6.5 3H19v15H6.5A1.5 1.5 0 0 0 5 19.5z"></path><path d="M5 19.5A1.5 1.5 0 0 0 6.5 21H19v-3"></path><path d="M9 7.5h6"></path></svg></span><span>Recipes</span></a>
<a href="Scan.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #17231C; font-size: 11px; font-weight: 700"><span style="display: flex; align-items: center; justify-content: center; width: 52px; height: 32px; border-radius: 16px; background: #2E6A4D; color: #FFFFFF"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8.5A1.5 1.5 0 0 1 5.5 7H8l1.6-2h4.8L16 7h2.5A1.5 1.5 0 0 1 20 8.5v9a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 17.5z"></path><circle cx="12" cy="12.5" r="3.5"></circle></svg></span><span>Scan</span></a>
</nav>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { done: { milk: true, bread: true, oats: true } };
  }
  renderVals() {
    const done = this.state.done;
    const raw = [
      { name: "Produce", items: [
        { id: "lemons", name: "Lemons", qty: "2", tag: "Orzo" },
        { id: "dill", name: "Fresh dill", qty: "1 bunch", tag: "Orzo" },
        { id: "coriander", name: "Coriander", qty: "1 bunch", tag: "Curry" },
        { id: "tomatoes", name: "Cherry tomatoes", qty: "250 g", tag: "" }
      ] },
      { name: "Dairy", items: [
        { id: "feta", name: "Feta", qty: "200 g", tag: "Orzo" },
        { id: "milk", name: "Whole milk", qty: "1 L", tag: "" },
        { id: "butter", name: "Butter", qty: "250 g", tag: "" }
      ] },
      { name: "Bakery & dry", items: [
        { id: "bread", name: "Sourdough loaf", qty: "1", tag: "" },
        { id: "oats", name: "Rolled oats", qty: "1 kg", tag: "" },
        { id: "chickpeas", name: "Chickpeas", qty: "2 × 400 g", tag: "Curry" }
      ] }
    ];
    let total = 0;
    let inBasket = 0;
    const groups = raw.map((g) => ({
      name: g.name,
      items: g.items.map((it) => {
        const checked = !!done[it.id];
        total += 1;
        if (checked) inBasket += 1;
        return {
          ...it,
          checked: checked,
          open: !checked,
          hasTag: !!it.tag,
          toggle: () => this.setState({ done: { ...this.state.done, [it.id]: !this.state.done[it.id] } })
        };
      })
    }));
    return {
      groups: groups,
      total: total,
      inBasket: inBasket,
      toBuy: total - inBasket,
      pct: Math.round((inBasket / total) * 100) + "%"
    };
  }
}
</script>
</body>
</html>
