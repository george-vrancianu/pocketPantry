<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Recording a Voice Note with Gator</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&amp;family=Instrument+Sans:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#5F6F2E}a:hover{color:#4A5722}
</style>
</helmet>
<div style="width: 864px; height: 912px; box-sizing: border-box; padding: 48px; background: #EDE5D6; font-family: 'Instrument Sans', system-ui, sans-serif; color: #2B2418; display: flex; gap: 48px">

  <sc-for list="{{phones}}" as="p" hint-placeholder-count="2">
  <div style="display: flex; flex-direction: column; gap: 16px; width: 360px">
    <div style="font-size: 15px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: #766A58; height: 24px">{{p.label}}</div>
    <div style="position: relative; width: 360px; height: 760px; border-radius: 40px; overflow: hidden; background: #F3EDE1; border: 1px solid #D6C9B2; box-shadow: 0 14px 34px -10px rgba(60,40,10,.28)">

      <!-- Shopping List behind -->
      <div style="padding: 52px 18px 0; display: flex; flex-direction: column; gap: 10px">
        <div style="display: flex; align-items: baseline; padding: 0 4px"><span style="font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 26px; flex-grow: 1">Shopping</span><span style="font-size: 14px; color: #766A58">5 to buy</span></div>
        <div style="font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: #766A58; padding: 6px 4px 0">Produce</div>
        <div style="background: #FBF8F1; border: 1px solid #E9E0CF; border-radius: 16px">
          <div style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-bottom: 1px solid #EFE7D8"><span style="width: 22px; height: 22px; border-radius: 7px; border: 2px solid #C2B49A; box-sizing: border-box"></span><span style="flex-grow: 1; font-size: 15px">Spinach</span><span style="font-size: 13px; color: #766A58">200 g</span></div>
          <div style="display: flex; align-items: center; gap: 12px; padding: 12px 14px"><span style="width: 22px; height: 22px; border-radius: 7px; border: 2px solid #C2B49A; box-sizing: border-box"></span><span style="flex-grow: 1; font-size: 15px">Bananas</span><span style="font-size: 13px; color: #766A58">6 pcs</span></div>
        </div>
        <div style="font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: #766A58; padding: 6px 4px 0">Dairy &amp; eggs</div>
        <div style="background: #FBF8F1; border: 1px solid #E9E0CF; border-radius: 16px">
          <div style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-bottom: 1px solid #EFE7D8"><span style="width: 22px; height: 22px; border-radius: 7px; border: 2px solid #C2B49A; box-sizing: border-box"></span><span style="flex-grow: 1; font-size: 15px">Milk</span><span style="font-size: 13px; color: #766A58">2 l</span></div>
          <div style="display: flex; align-items: center; gap: 12px; padding: 12px 14px"><span style="width: 22px; height: 22px; border-radius: 7px; border: 2px solid #C2B49A; box-sizing: border-box"></span><span style="flex-grow: 1; font-size: 15px">Greek yoghurt</span><span style="font-size: 13px; color: #766A58">2 pcs</span></div>
        </div>
        <div style="font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: #766A58; padding: 6px 4px 0">Bakery</div>
        <div style="background: #FBF8F1; border: 1px solid #E9E0CF; border-radius: 16px">
          <div style="display: flex; align-items: center; gap: 12px; padding: 12px 14px"><span style="width: 22px; height: 22px; border-radius: 7px; border: 2px solid #C2B49A; box-sizing: border-box"></span><span style="flex-grow: 1; font-size: 15px">Bread</span><span style="font-size: 13px; color: #766A58">1 pcs</span></div>
        </div>
      </div>

      <sc-if value="{{p.recording}}" hint-placeholder-val="{{true}}">
        <div style="position: absolute; inset: 0; background: rgba(43,36,24,.32)"></div>
      </sc-if>

      <!-- Dock (main): Home · Shopping · Camera/Mic · Pantry · Recipes -->
      <nav aria-label="Main" style="position: absolute; left: 16px; right: 16px; bottom: 28px; height: 76px; box-sizing: border-box; padding: 8px; border-radius: 22px; background: rgba(251,248,241,.94); border: 1px solid #E6DCCB; box-shadow: 0 14px 34px -10px rgba(60,40,10,.28); display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)) 66px repeat(2, minmax(0, 1fr)); gap: 4px; font-size: 11px; font-weight: 600; color: #766A58"><a href="#" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #766A58; text-decoration: none"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 21v-8a1 1 0 0 0-1-1h-2a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>Home</a><a href="#" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; border-radius: 14px; background: #E6EAD2; color: #4A5722; font-weight: 700; text-decoration: none"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10h16l-1.5 9h-13z"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>Shopping</a><div style="position: relative"><div style="position: absolute; left: 2px; top: -26px; bottom: -26px; width: 62px; display: flex; flex-direction: column; border-radius: 999px; background: #5F6F2E; color: #FFFFFF; outline: 4px solid #F3EDE1; box-shadow: 0 14px 34px -10px rgba(60,40,10,.5)"><a href="#" aria-label="Camera" style="flex: 1; display: flex; align-items: center; justify-content: center; color: #FFFFFF; border-radius: 999px 999px 0 0"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg></a><span aria-hidden="true" style="height: 1px; margin: 0 12px; background: rgba(255,255,255,.35)"></span><button type="button" aria-label="Hold to record a Voice Note" aria-pressed="{{p.pressed}}" style="position: relative; flex: 1; display: flex; align-items: center; justify-content: center; border: 0; background: {{p.micBg}}; color: #FFFFFF; border-radius: 0 0 999px 999px"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><path d="M12 19v3"/></svg><sc-if value="{{p.recording}}" hint-placeholder-val="{{true}}"><span aria-hidden="true" style="position: absolute; left: 10px; right: 10px; bottom: 5px; height: 4px; border-radius: 999px; background: linear-gradient(to right, #FBF8F1 30%, rgba(251,248,241,.3) 0)"></span></sc-if></button></div></div><a href="#" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #766A58; text-decoration: none"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16v13H4z"/><path d="M4 12h16M9 7V4h6v3"/></svg>Pantry</a><a href="#" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #766A58; text-decoration: none"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h14v16H5z"/><path d="M8 9h8M8 13h8M8 17h5"/></svg>Recipes</a></nav>
      <!-- Scan Language chip above the capsule -->
      <div style="position: absolute; left: 0; right: 0; bottom: 128px; display: flex; justify-content: center"><span style="height: 30px; min-width: 40px; padding: 0 9px; box-sizing: border-box; border-radius: 999px; background: #FBF8F1; border: 1px solid #D6C9B2; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 800; letter-spacing: .06em">EN</span></div>

      <!-- A · Gator in the Listening card -->
      <sc-if value="{{p.isA}}" hint-placeholder-val="{{false}}">
        <div style="position: absolute; left: 16px; right: 16px; bottom: 186px; background: #FBF8F1; border-radius: 18px; box-shadow: 0 14px 34px -10px rgba(60,40,10,.4); padding: 12px 16px 14px 6px; display: flex; gap: 6px; align-items: center">
          <img src="/_blob/a46c06821ea3739466e002cf6a19596d" alt="Gator listening" style="width: 112px; height: 85px; flex-shrink: 0">
          <div style="flex-grow: 1; min-width: 0">
            <div style="display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 700"><span style="width: 9px; height: 9px; border-radius: 50%; background: #A8431C"></span>Gator's listening<span style="margin-left: auto; font-weight: 600; color: #766A58; font-variant-numeric: tabular-nums">0:18 / 1:00</span></div>
            <div aria-hidden="true" style="display: flex; align-items: center; gap: 3px; height: 28px; margin-top: 8px">
              <span style="width: 4px; height: 8px; border-radius: 2px; background: #A8431C"></span><span style="width: 4px; height: 16px; border-radius: 2px; background: #A8431C"></span><span style="width: 4px; height: 24px; border-radius: 2px; background: #A8431C"></span><span style="width: 4px; height: 14px; border-radius: 2px; background: #A8431C"></span><span style="width: 4px; height: 20px; border-radius: 2px; background: #A8431C"></span><span style="width: 4px; height: 28px; border-radius: 2px; background: #A8431C"></span><span style="width: 4px; height: 18px; border-radius: 2px; background: #A8431C"></span><span style="width: 4px; height: 10px; border-radius: 2px; background: #A8431C"></span><span style="width: 4px; height: 22px; border-radius: 2px; background: #A8431C"></span><span style="width: 4px; height: 12px; border-radius: 2px; background: #A8431C"></span><span style="width: 4px; height: 6px; border-radius: 2px; background: #D6C9B2"></span><span style="width: 4px; height: 6px; border-radius: 2px; background: #D6C9B2"></span><span style="width: 4px; height: 6px; border-radius: 2px; background: #D6C9B2"></span><span style="width: 4px; height: 6px; border-radius: 2px; background: #D6C9B2"></span>
            </div>
            <div style="font-size: 12.5px; color: #766A58; margin-top: 6px">EN · to your Shopping List</div>
          </div>
        </div>
      </sc-if>



      <!-- Reading state -->
      <sc-if value="{{p.isReading}}" hint-placeholder-val="{{false}}">
        <div role="status" style="position: absolute; left: 16px; right: 16px; bottom: 186px; background: #FBF8F1; border: 1px solid #E9E0CF; border-radius: 18px; box-shadow: 0 14px 34px -10px rgba(60,40,10,.35); padding: 8px 14px 8px 4px; display: flex; align-items: center; gap: 6px">
          <img src="/_blob/a8d779979a6a561576b541e16f1b1b08" alt="Gator thinking" style="width: 88px; height: 71px; flex-shrink: 0">
          <div style="flex-grow: 1"><div style="font-weight: 700; font-size: 14.5px">Gator's reading your note…</div><div style="font-size: 12.5px; color: #766A58; margin-top: 2px">0:18 · English · keep shopping</div></div>
          <a href="#" style="font-size: 14px; font-weight: 600">Cancel</a>
        </div>
      </sc-if>

    </div>
  </div>
  </sc-for>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":864,"height":912}}'>
class Component extends DCLogic {
renderVals() {
const base = { recording: true, isA: false, isReading: false, pressed: 'true', micBg: '#A8431C' };
return {
phones: [
{ ...base, label: 'Listening card (A)', isA: true },
{ ...base, label: 'After you let go', recording: false, isReading: true, pressed: 'false', micBg: 'transparent' }
]
};
}
}
</script>
</body>
</html>
