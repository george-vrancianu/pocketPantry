<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Intro 2 · Languages</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&amp;family=Instrument+Sans:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#5F6F2E}a:hover{color:#4A5722}
</style>
</head>
<body>
<div style="width: 360px; height: 760px; overflow: hidden; background: #F3EDE1; font-family: 'Instrument Sans', system-ui, sans-serif; color: #2B2418; display: flex; flex-direction: column; box-sizing: border-box; padding: 52px 20px 32px">
  <a href="01-launch.html" style="font-size: 15px; font-weight: 600; align-self: flex-start; padding: 6px 4px">‹ Back</a>
  <div style="display: flex; align-items: center; gap: 4px; margin-top: 8px">
    <img src="../gator/gator-app-icon.svg" alt="" aria-hidden="true" style="width: 44px; height: 44px; flex-shrink: 0">
    <h1 style="font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 28px; line-height: 1.15; margin: 0 0 0 8px">Your languages</h1>
  </div>

  <div style="font-size: 12px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: #766A58; margin: 22px 4px 8px">App language</div>
  <div role="radiogroup" aria-label="App language" style="display: flex; flex-direction: column; gap: 8px">
    
      <button type="button" role="radio" aria-checked="true" lang="en" onClick="" style="height: 50px; border-radius: 14px; border: 2px solid #5F6F2E; background: #E6EAD2; display: flex; align-items: center; gap: 10px; padding: 0 14px; font: 600 16px 'Instrument Sans', sans-serif; color: #2B2418; text-align: left">
        <span style="flex-grow: 1">English</span>
        
          <span style="width: 24px; height: 24px; border-radius: 50%; background: #5F6F2E; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>
        
      </button>
    
      <button type="button" role="radio" aria-checked="false" lang="ro" onClick="" style="height: 50px; border-radius: 14px; border: 2px solid #E9E0CF; background: #FBF8F1; display: flex; align-items: center; gap: 10px; padding: 0 14px; font: 600 16px 'Instrument Sans', sans-serif; color: #2B2418; text-align: left">
        <span style="flex-grow: 1">Română</span>
        
      </button>
    
      <button type="button" role="radio" aria-checked="false" lang="da" onClick="" style="height: 50px; border-radius: 14px; border: 2px solid #E9E0CF; background: #FBF8F1; display: flex; align-items: center; gap: 10px; padding: 0 14px; font: 600 16px 'Instrument Sans', sans-serif; color: #2B2418; text-align: left">
        <span style="flex-grow: 1">Dansk</span>
        
      </button>
    
  </div>
  <div style="font-size: 12.5px; color: #766A58; margin: 6px 4px 0">Picked from your phone's language</div>

  <div style="font-size: 12px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: #766A58; margin: 22px 4px 8px">Also used for</div>
  <div style="background: #FBF8F1; border: 1px solid #E9E0CF; border-radius: 16px">
    
      <button type="button" onClick="" aria-label="Voice Notes: Same · English. Change" style="width: 100%; display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 0; border-bottom: 1px solid #EFE7D8; background: transparent; text-align: left; font-family: 'Instrument Sans', sans-serif; color: #2B2418">
        <span style="flex-grow: 1; min-width: 0">
          <span style="display: block; font-size: 15px; font-weight: 600">Voice Notes</span>
          <span style="display: block; font-size: 12.5px; color: #766A58; margin-top: 2px">What you say to Gator</span>
        </span>
        <span style="height: 30px; padding: 0 10px; border-radius: 999px; border: 1px solid #D6C9B2; background: #F3EDE1; display: flex; align-items: center; font-size: 13px; font-weight: 700; color: #5C5243; white-space: nowrap">Same · English</span>
      </button>
    
      <button type="button" onClick="" aria-label="Receipts & labels: Same · English. Change" style="width: 100%; display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 0; border-bottom: 1px solid #EFE7D8; background: transparent; text-align: left; font-family: 'Instrument Sans', sans-serif; color: #2B2418">
        <span style="flex-grow: 1; min-width: 0">
          <span style="display: block; font-size: 15px; font-weight: 600">Receipts & labels</span>
          <span style="display: block; font-size: 12.5px; color: #766A58; margin-top: 2px">What the camera reads</span>
        </span>
        <span style="height: 30px; padding: 0 10px; border-radius: 999px; border: 1px solid #D6C9B2; background: #F3EDE1; display: flex; align-items: center; font-size: 13px; font-weight: 700; color: #5C5243; white-space: nowrap">Same · English</span>
      </button>
    
      <button type="button" onClick="" aria-label="Grocery names: Same · English. Change" style="width: 100%; display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 0; border-bottom: 1px solid transparent; background: transparent; text-align: left; font-family: 'Instrument Sans', sans-serif; color: #2B2418">
        <span style="flex-grow: 1; min-width: 0">
          <span style="display: block; font-size: 15px; font-weight: 600">Grocery names</span>
          <span style="display: block; font-size: 12.5px; color: #766A58; margin-top: 2px">How items are named in your lists</span>
        </span>
        <span style="height: 30px; padding: 0 10px; border-radius: 999px; border: 1px solid #D6C9B2; background: #F3EDE1; display: flex; align-items: center; font-size: 13px; font-weight: 700; color: #5C5243; white-space: nowrap">Same · English</span>
      </button>
    
  </div>
  <div style="font-size: 12.5px; color: #766A58; margin: 8px 4px 0; line-height: 1.4">Shopping abroad? Set Receipts &amp; labels to that country's language. You can change all of these later in Settings.</div>

  <div style="flex-grow: 1"></div>
  <a href="03-setup-or-skip.html" style="width: 100%; height: 52px; border-radius: 12px; background: #5F6F2E; color: #FFFFFF; font-weight: 600; font-size: 16px; display: flex; align-items: center; justify-content: center; text-decoration: none">Continue</a>
</div>
</body>
</html>
