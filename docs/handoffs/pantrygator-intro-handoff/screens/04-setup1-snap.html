<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Setup 1 · Snap a photo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&amp;family=Instrument+Sans:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#FBF8F1}a:hover{color:#F0C96B}
@keyframes ppPulse{0%{box-shadow:0 0 0 0 rgba(240,201,107,.75)}100%{box-shadow:0 0 0 16px rgba(240,201,107,0)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
</head>
<body>
<div style="position: relative; width: 360px; height: 760px; overflow: hidden; background: #5F6F2E; font-family: 'Instrument Sans', system-ui, sans-serif; color: #FBF8F1">
  <div style="display: flex; flex-direction: column; box-sizing: border-box; padding: 52px 24px 0">
    <div style="display: flex; align-items: center; gap: 12px">
      <div aria-hidden="true" style="flex-grow: 1; display: flex; gap: 6px"><span style="flex: 1; height: 6px; border-radius: 3px; background: #F0C96B"></span><span style="flex: 1; height: 6px; border-radius: 3px; background: rgba(251,248,241,.28)"></span></div>
      <span style="font-size: 14px; font-weight: 600">1 of 2</span>
      <a href="06-setup2-say-it.html" style="font-size: 15px; font-weight: 600; padding: 6px 2px">Skip</a>
    </div>

    <div style="display: flex; align-items: flex-end; gap: 0; margin-top: 18px">
      <img src="../gator/gator-talking.svg" alt="Gator talking" style="width: 132px; height: 100px; flex-shrink: 0; margin-left: -12px">
      <div style="position: relative; background: #FBF8F1; color: #2B2418; border-radius: 18px; padding: 12px 14px; font-size: 15.5px; font-weight: 600; line-height: 1.35; margin-bottom: 30px">Put some food on the counter and snap it. I’ll work out what it all is.</div>
    </div>

    <div style="font-size: 12px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: #EEF0DE; margin: 22px 4px 8px">What's in front of you?</div>
    <div role="radiogroup" aria-label="What to snap" style="display: flex; flex-direction: column; gap: 8px">
      
        <button type="button" role="radio" aria-checked="true" onClick="" style="display: flex; gap: 14px; align-items: center; padding: 12px 14px; border-radius: 16px; border: 3px solid #F0C96B; background: #FBF8F1; color: #2B2418; text-align: left; font-family: 'Instrument Sans', sans-serif">
          <span style="width: 44px; height: 44px; border-radius: 50%; background: #2A231C; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
            <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="14" r="5"/><circle cx="16" cy="10" r="4"/><path d="M16 6V3"/></svg>
            
          </span>
          <span style="flex-grow: 1; font-size: 14px; line-height: 1.35"><strong style="font-size: 15px">Ingredients</strong><br>Fruit, veg, packets and tins on the counter</span>
          
            <span style="width: 24px; height: 24px; border-radius: 50%; background: #5F6F2E; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>
          
        </button>
      
        <button type="button" role="radio" aria-checked="false" onClick="" style="display: flex; gap: 14px; align-items: center; padding: 12px 14px; border-radius: 16px; border: 3px solid transparent; background: #4A5722; color: #FBF8F1; text-align: left; font-family: 'Instrument Sans', sans-serif">
          <span style="width: 44px; height: 44px; border-radius: 50%; background: #2A231C; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
            
            <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg>
          </span>
          <span style="flex-grow: 1; font-size: 14px; line-height: 1.35"><strong style="font-size: 15px">Receipt</strong><br>The receipt from your last shop, laid flat</span>
          
        </button>
      
    </div>
  </div>

  <!-- coach callout pointing at the camera -->
  <div style="position: absolute; left: 40px; right: 40px; bottom: 150px; background: #FBF8F1; color: #2B2418; border-radius: 16px; padding: 10px 14px; text-align: center; box-shadow: 0 14px 34px -10px rgba(20,24,8,.55)">
    <div style="font-size: 15px; font-weight: 700">Tap the camera to start</div>
    <div style="font-size: 12.5px; color: #5C5243; margin-top: 2px">It's always here, in the middle of the menu</div>
  </div>
  <div aria-hidden="true" style="position: absolute; left: 169px; bottom: 138px; width: 0; height: 0; border-left: 11px solid transparent; border-right: 11px solid transparent; border-top: 12px solid #FBF8F1"></div>

  <!-- the real Dock: only the camera is live -->
  <nav aria-label="Main" style="position: absolute; left: 16px; right: 16px; bottom: 28px; height: 76px; box-sizing: border-box; padding: 8px; border-radius: 22px; background: rgba(251,248,241,.94); border: 1px solid #E6DCCB; box-shadow: 0 14px 34px -10px rgba(20,24,8,.45); display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)) 66px repeat(2, minmax(0, 1fr)); gap: 4px; font-size: 11px; font-weight: 600; color: #766A58">
    <span aria-disabled="true" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; opacity: .38"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 21v-8a1 1 0 0 0-1-1h-2a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>Home</span>
    <span aria-disabled="true" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; opacity: .38"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10h16l-1.5 9h-13z"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>Shopping</span>
    <div style="position: relative">
      <div style="position: absolute; left: 2px; top: -26px; bottom: -26px; width: 62px; display: flex; flex-direction: column; border-radius: 999px; background: #5F6F2E; color: #FFFFFF; outline: 3px solid #FBF8F1; box-shadow: 0 14px 34px -10px rgba(20,24,8,.5)">
        <a href="05-setup1-review.html" aria-label="Camera" style="flex: 1; display: flex; align-items: center; justify-content: center; border-radius: 999px 999px 0 0; background: #F0C96B; color: #4A3608; animation: ppPulse 1.6s ease-out infinite"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg></a>
        <span aria-hidden="true" style="height: 1px; margin: 0 12px; background: rgba(255,255,255,.35)"></span>
        <span aria-disabled="true" style="flex: 1; display: flex; align-items: center; justify-content: center; opacity: .4"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><path d="M12 19v3"/></svg></span>
      </div>
    </div>
    <span aria-disabled="true" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; opacity: .38"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16v13H4z"/><path d="M4 12h16M9 7V4h6v3"/></svg>Pantry</span>
    <span aria-disabled="true" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; opacity: .38"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h14v16H5z"/><path d="M8 9h8M8 13h8M8 17h5"/></svg>Recipes</span>
  </nav>
</div>

</html>
