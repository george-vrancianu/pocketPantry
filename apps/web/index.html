<!doctype html>
<html lang="en" data-theme="warm">
  <head>
    <meta charset="UTF-8" />
    <!-- No zoom: maximum-scale=1 also stops iOS zooming in on focused inputs under 16px. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <!-- Until the pre-paint script resolves the Theme: Warm editorial in light mode, Dark-first in dark mode. -->
    <meta
      name="theme-color"
      content="#F3EDE1"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#0F1512"
      media="(prefers-color-scheme: dark)"
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- iOS: "Add to Home Screen" opens full-screen under this name. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Pantry" />
    <title>Pocket Pantry</title>
    <!-- The pre-paint script that sets data-theme and theme-color is injected here by vite.config.ts. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
