<linearGradient id="tileClay-proud" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6C7D37"/><stop offset="1" stop-color="#4F5D25"/></linearGradient>
<filter id="claySoft-proud" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#2B2418" flood-opacity=".22"/></filter>
<filter id="blur6-proud" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="6"/></filter>
<filter id="blur3-proud" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3"/></filter>
