<!doctype html>
<html lang="en" data-theme="warm">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Until the pre-paint script resolves the Theme: Warm editorial in light mode, Dark-first in dark mode. -->
    <meta
      name="theme-color"
      content="#F3EDE1"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#0F1512"
      media="(prefers-color-scheme: dark)"
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- iOS: "Add to Home Screen" opens full-screen under this name. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Pantry" />
    <title>Pocket Pantry</title>
    <!-- The three Themes' font pairs; a browser downloads only the faces in use. Self-hosted in #251. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,500..700,50&family=Instrument+Sans:wght@400;500;600;700&family=Schibsted+Grotesk:wght@500;600;700;800&family=Figtree:wght@400;500;600;700&family=Sora:wght@500;600;700&family=Albert+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- The pre-paint script that sets data-theme and theme-color is injected here by vite.config.ts. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
