<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Intro 2 · Languages</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&amp;family=Instrument+Sans:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#5F6F2E}a:hover{color:#4A5722}
</style>
</helmet>
<div style="width: 360px; height: 760px; overflow: hidden; background: #F3EDE1; font-family: 'Instrument Sans', system-ui, sans-serif; color: #2B2418; display: flex; flex-direction: column; box-sizing: border-box; padding: 52px 20px 32px">
  <a href="Main.dc.html" style="font-size: 15px; font-weight: 600; align-self: flex-start; padding: 6px 4px">‹ Back</a>
  <div style="display: flex; align-items: center; gap: 4px; margin-top: 8px">
    <img src="/_blob/9ac5a5612c7f0c0d900cefffc56c39f5" alt="" aria-hidden="true" style="width: 44px; height: 44px; flex-shrink: 0">
    <h1 style="font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 28px; line-height: 1.15; margin: 0 0 0 8px">Your languages</h1>
  </div>

  <div style="font-size: 12px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: #766A58; margin: 22px 4px 8px">App language</div>
  <div role="radiogroup" aria-label="App language" style="display: flex; flex-direction: column; gap: 8px">
    <sc-for list="{{apps}}" as="l" hint-placeholder-count="3">
      <button type="button" role="radio" aria-checked="{{l.checked}}" lang="{{l.code}}" onClick="{{l.pick}}" style="height: 50px; border-radius: 14px; border: 2px solid {{l.border}}; background: {{l.bg}}; display: flex; align-items: center; gap: 10px; padding: 0 14px; font: 600 16px 'Instrument Sans', sans-serif; color: #2B2418; text-align: left">
        <span style="flex-grow: 1">{{l.name}}</span>
        <sc-if value="{{l.selected}}" hint-placeholder-val="{{false}}">
          <span style="width: 24px; height: 24px; border-radius: 50%; background: #5F6F2E; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>
        </sc-if>
      </button>
    </sc-for>
  </div>
  <div style="font-size: 12.5px; color: #766A58; margin: 6px 4px 0">Picked from your phone's language</div>

  <div style="font-size: 12px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: #766A58; margin: 22px 4px 8px">Also used for</div>
  <div style="background: #FBF8F1; border: 1px solid #E9E0CF; border-radius: 16px">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="3">
      <button type="button" onClick="{{r.cycle}}" aria-label="{{r.aria}}" style="width: 100%; display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 0; border-bottom: 1px solid {{r.divider}}; background: transparent; text-align: left; font-family: 'Instrument Sans', sans-serif; color: #2B2418">
        <span style="flex-grow: 1; min-width: 0">
          <span style="display: block; font-size: 15px; font-weight: 600">{{r.title}}</span>
          <span style="display: block; font-size: 12.5px; color: #766A58; margin-top: 2px">{{r.hint}}</span>
        </span>
        <span style="height: 30px; padding: 0 10px; border-radius: 999px; border: 1px solid {{r.chipBorder}}; background: {{r.chipBg}}; display: flex; align-items: center; font-size: 13px; font-weight: 700; color: {{r.chipFg}}; white-space: nowrap">{{r.value}}</span>
      </button>
    </sc-for>
  </div>
  <div style="font-size: 12.5px; color: #766A58; margin: 8px 4px 0; line-height: 1.4">Shopping abroad? Set Receipts &amp; labels to that country's language. You can change all of these later in Settings.</div>

  <div style="flex-grow: 1"></div>
  <a href="IntroSetup.dc.html" style="width: 100%; height: 52px; border-radius: 12px; background: #5F6F2E; color: #FFFFFF; font-weight: 600; font-size: 16px; display: flex; align-items: center; justify-content: center; text-decoration: none">Continue</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":760}}'>
class Component extends DCLogic {
renderVals() {
const LANGS = [
{ code: 'en', name: 'English' },
{ code: 'ro', name: 'Română' },
{ code: 'da', name: 'Dansk' }
];
const s = Object.assign({ app: 'en', voice: null, scan: null, names: null }, this.state || {});
const nameOf = (c) => LANGS.find((l) => l.code === c).name;
const apps = LANGS.map((l) => ({
code: l.code,
name: l.name,
selected: s.app === l.code,
checked: s.app === l.code ? 'true' : 'false',
border: s.app === l.code ? '#5F6F2E' : '#E9E0CF',
bg: s.app === l.code ? '#E6EAD2' : '#FBF8F1',
pick: () => this.setState({ app: l.code })
}));
const defs = [
{ key: 'voice', title: 'Voice Notes', hint: 'What you say to Gator' },
{ key: 'scan', title: 'Receipts & labels', hint: 'What the camera reads' },
{ key: 'names', title: 'Grocery names', hint: 'How items are named in your lists' }
];
const rows = defs.map((d, i) => {
const own = s[d.key];
const value = own ? nameOf(own) : 'Same · ' + nameOf(s.app);
const cycleList = [null].concat(LANGS.map((l) => l.code).filter((c) => c !== s.app));
const next = cycleList[(cycleList.indexOf(own) + 1) % cycleList.length];
return {
title: d.title,
hint: d.hint,
value: value,
aria: d.title + ': ' + value + '. Change',
divider: i < defs.length - 1 ? '#EFE7D8' : 'transparent',
chipBorder: own ? '#5F6F2E' : '#D6C9B2',
chipBg: own ? '#E6EAD2' : '#F3EDE1',
chipFg: own ? '#4A5722' : '#5C5243',
cycle: () => this.setState({ [d.key]: next })
};
});
return { apps, rows };
}
}
</script>
</body>
</html>
