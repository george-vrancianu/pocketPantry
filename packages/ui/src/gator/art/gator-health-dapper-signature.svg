<svg xmlns="http://www.w3.org/2000/svg" viewBox="-34 -66 290 244" width="290" height="244" class="gator g-dapper" data-v="sig" role="img" aria-label="Gator with a monocle and a bubble pipe"><style>.gator g[class]:not([transform]), .gator .arc{transform-box:fill-box}
.rig{transform-origin:50% 100%}
.eye{transform-origin:50% 55%}
.hat{transform-origin:50% 100%}
.tail{transform-origin:95% 80%}
.sparkle, .dot, .bubble, .arc{transform-origin:50% 50%}
.jaw{transform-origin:13% 8%}
.head{transform-origin:45% 95%}
.qmark{transform-origin:40% 100%}
.basket{transform-origin:50% 12%}
.whisk{transform-origin:100% 100%}
.spoon{transform-origin:0% 100%}
.rack{transform-origin:50% 0%}
.tick path{stroke-dasharray:1; stroke-dashoffset:0}
[data-v="sig"] .eye{animation:blink calc(4.4s) infinite}
[data-v="sig"] .eye-far{animation-delay:calc(.04s)}
.drop{transform-origin:50% 0%}
[data-v="sig"] .rig{animation:breathe calc(3.2s) ease-in-out infinite}
[data-v="sig"] .tail{animation:wag calc(1.6s) ease-in-out infinite}
.g-dapper[data-v="sig"] .bubble{animation:bubbleUp calc(3s) ease-out infinite; animation-delay:calc(var(--i)*-1s)}
.g-dapper[data-v="sig"] .shine{animation:glint calc(3s) ease-in-out infinite}
.g-dapper[data-v="sig"] .rig{animation:sway calc(4s) ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(calc(1 + .006*1),calc(1 + .022*1))}}
@keyframes blink{0%,90%,97%,100%{transform:scaleY(1)}93.5%{transform:scaleY(.08)}}
@keyframes wag{0%,100%{transform:rotate(calc(-5deg*1))}50%{transform:rotate(calc(7deg*1))}}
@keyframes sway{0%,100%{transform:rotate(calc(-1.6deg*1))}50%{transform:rotate(calc(1.6deg*1))}}
@keyframes bubbleUp{0%{transform:translate(0,0) scale(.3);opacity:0}15%{opacity:1;transform:scale(1)}80%{opacity:.9}100%{transform:translate(calc(-8px*1),calc(-30px*1)) scale(1.15);opacity:0}}
@keyframes glint{0%,62%,100%{opacity:.25}75%{opacity:1}}
