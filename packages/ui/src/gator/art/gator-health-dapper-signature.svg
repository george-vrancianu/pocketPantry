"M112 114 l4 -7 l4 6 Z M156 109 l4 -7 l4 6 Z M200 104 l3 -6 l3 5 Z" fill="#fff"/><ellipse cx="64" cy="98" rx="11" ry="8" fill="#F2A08B" opacity=".6"/><circle cx="94" cy="44" r="16.5" fill="#6FAE48"/><circle cx="126" cy="44" r="10.5" fill="#6FAE48"/><path d="M82 50 Q94 34 106 50" fill="none" stroke="#2E3A1F" stroke-width="4.5" stroke-linecap="round"/><path d="M119 49 Q126 40 133 49" fill="none" stroke="#2E3A1F" stroke-width="3.5" stroke-linecap="round"/><g class="monocle"><circle cx="94" cy="44" r="20" fill="rgba(255,255,255,.22)" stroke="#B87A1E" stroke-width="5.5"/><circle cx="94" cy="44" r="16.5" fill="none" stroke="#F0C96B" stroke-width="1.6"/><g class="shine"><path d="M83 33 Q88 28 95 28" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity=".9"/></g><path d="M78 58 Q62 76 74 92" fill="none" stroke="#B87A1E" stroke-width="2.8" stroke-dasharray="5 3" stroke-linecap="round"/></g><g class="pipe"><path d="M92 116 L58 134" stroke="#4A2F18" stroke-width="6" stroke-linecap="round"/><path d="M40 118 H62 V134 Q62 146 51 146 Q40 146 40 134 Z" fill="#7A4E2C"/><ellipse cx="51" cy="118" rx="11" ry="3.5" fill="#4A2F18"/></g><g fill="rgba(255,255,255,.75)" stroke="#8CCBEA" stroke-width="2"><g class="bubble" style="--i:0"><circle cx="34" cy="104" r="5"/></g><g class="bubble" style="--i:1"><circle cx="16" cy="88" r="7"/></g><g class="bubble" style="--i:2"><circle cx="-2" cy="66" r="4.5"/></g></g></g></svg>