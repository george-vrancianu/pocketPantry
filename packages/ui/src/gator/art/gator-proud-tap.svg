<svg xmlns="http://www.w3.org/2000/svg" viewBox="-8 -72 296 252" width="296" height="252" class="gator g-proud" data-v="tap" role="img" aria-label="Gator beaming with pride"><style>svg{--amp:1;--t:1}
/* ---------- motion rig ---------- */
.gator g[class]:not([transform]),.gator .arc{transform-box:fill-box}
.rig{transform-origin:50% 100%}
.eye{transform-origin:50% 55%}
.hat{transform-origin:50% 100%}
.tail{transform-origin:95% 80%}
.sparkle,.dot,.bubble,.arc{transform-origin:50% 50%}
.jaw{transform-origin:13% 8%}
.head{transform-origin:45% 95%}
.qmark{transform-origin:40% 100%}
.basket{transform-origin:50% 12%}
.whisk{transform-origin:100% 100%}
.spoon{transform-origin:0% 100%}
.rack{transform-origin:50% 0%}
.tick path{stroke-dasharray:1; stroke-dashoffset:0}
/* Idle: breathe, blink, hat sway, tail */
.drop{transform-origin:50% 0%}
/* Signature defaults */
/* Entrance (looped so you can watch it) */
/* Tap (looped) */
/* Real tap on any stage */
/* ---- Signatures ---- */
/* ---- Keyframes (amplitudes scale with --amp) ---- */
[data-v="tap"] .rig{animation:boingOnce calc(.9s*var(--t)) linear 1}
[data-v="tap"] .hat{animation:hatHopOnce calc(.9s*var(--t)) linear 1}
[data-v="tap"] .eye{animation:squintOnce calc(.9s*var(--t)) linear 1}
[data-v="tap"] .tail{animation:wagFast calc(.9s*var(--t)) linear 1}
@keyframes wagFast{0%,4%,50%,100%{transform:none}14%{transform:rotate(calc(12deg*var(--amp)))}24%{transform:rotate(calc(-8deg*var(--amp)))}34%{transform:rotate(calc(8deg*var(--amp)))}}
@keyframes boingOnce{0%,100%{transform:none}15%{transform:scale(calc(1 + .1*var(--amp)),calc(1 - .12*var(--amp)))}40%{transform:translateY(calc(-22px*var(--amp))) scale(calc(1 - .06*var(--amp)),calc(1 + .1*var(--amp)))}62%{transform:translateY(0) scale(calc(1 + .08*var(--amp)),calc(1 - .1*var(--amp)))}80%{transform:scale(calc(1 - .02*var(--amp)),calc(1 + .02*var(--amp)))}}
@keyframes hatHopOnce{0%,20%,100%{transform:none}44%{transform:translateY(calc(-10px*var(--amp))) rotate(calc(-14deg*var(--amp)))}66%{transform:translateY(calc(-2px*var(--amp))) rotate(calc(5deg*var(--amp)))}84%{transform:none}}
@keyframes squintOnce{0%,80%,100%{transform:scaleY(1)}12%,60%{transform:scaleY(.15)}}
@media (prefers-reduced-motion: reduce){svg *{animation:none !important}}</style><defs>
<radialGradient id="clayBody-proud" cx="32%" cy="28%" r="82%"><stop offset="0" stop-color="#8CC65F"/><stop offset=".55" stop-color="#6FAE48"/><stop offset="1" stop-color="#56923A"/></radialGradient>
